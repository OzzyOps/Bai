[project]
name = "bai-api"
version = "0.1.0"
description = "BAi API — thin, typed, RLS-respecting."
requires-python = ">=3.12"
dependencies = [
  "bai-platform",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "structlog>=24.4",
  "sentry-sdk[fastapi]>=2.18",
  "slowapi>=0.1.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.13", "ruff>=0.7", "pip-audit>=2.7"]

[tool.uv.sources]
bai-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bai_api"]
