[project]
name = "bai-platform"
version = "0.1.0"
description = "The BAi platform substrate — built once, inherited by every product."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "structlog>=24.4"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "psycopg[binary]>=3.2", "pyyaml>=6.0", "mypy>=1.13", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bai_platform"]
